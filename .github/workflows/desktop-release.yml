name: desktop

on:
  push:
    tags:
      - 'desktop-v*'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/core/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'

jobs:
  # Lightweight checks on PRs.
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @afterglow/core
      - run: npm run typecheck -w afterglow-desktop
      - run: npm test -w afterglow-desktop
      - run: npm run build -w afterglow-desktop

  # Installers on desktop-v* tags, uploaded to a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder-args: --win
          - os: ubuntu-latest
            builder-args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @afterglow/core
      - run: npm run typecheck -w afterglow-desktop
      - run: npm test -w afterglow-desktop
      - run: npm run build -w afterglow-desktop
      - name: Package installers
        run: npx electron-builder ${{ matrix.builder-args }} --publish never
        working-directory: apps/desktop
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          fail_on_unmatched_files: false
          generate_release_notes: true
