name: mobile-release

# Release APK on mobile-m* tags, uploaded to a GitHub Release —
# the mobile counterpart of desktop-release.yml. apps/mobile/android is
# gitignored (expo prebuild output), so CI regenerates it with prebuild,
# then runs Gradle; Metro bundling happens inside assembleRelease. The
# release build signs with the standard shared debug keystore (same
# signature as local builds), so testers upgrade in place.
on:
  push:
    tags:
      - 'mobile-m*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/release-preflight.mjs mobile "${{ github.ref_name }}"
      - run: npm run build -w @afterglow/core
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -w @afterglow/core
      - run: npm test -w afterglow-companion
      - run: npm run typecheck -w afterglow-companion
      - name: Generate the android project
        run: npx expo prebuild --platform android --clean --no-install
        working-directory: apps/mobile
      - name: Accept Android SDK licenses
        # The runner image lags new platforms (compileSdk 36); Gradle can only
        # auto-install missing SDK packages once their licenses are accepted.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build release APK
        # Surface failures as annotations — job logs need repo admin, but
        # check-run annotations are publicly readable.
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/gradle.log || {
            grep -E "FAILURE:|> Task .* FAILED|Caused by|error:|Error:" /tmp/gradle.log | tail -8 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
      - name: Name and verify the APK
        run: |
          mkdir -p release/mobile
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "release/mobile/afterglow-companion-${GITHUB_REF_NAME}.apk"
          node scripts/release-artifacts.mjs mobile release/mobile
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/mobile/afterglow-companion-*.apk
            release/mobile/SHA256SUMS-mobile.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
