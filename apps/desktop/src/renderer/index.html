<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src afterglow:; script-src 'self'; style-src 'self'">
  <title>Afterglow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="settings" class="screen hidden">
    <h1>Afterglow</h1>
    <p>An ambient display for the photos you actually finished.</p>
    <div class="settings-grid">
      <span class="settings-label">Folders</span>
      <div class="settings-field">
        <div id="folders" class="folder-list"></div>
        <button id="choose" type="button">Choose folders…</button>
      </div>
      <label class="settings-label" for="duration">Slide duration</label>
      <div class="settings-field">
        <input id="duration" type="number" min="2" max="3600" step="1"> <span class="unit">seconds</span>
      </div>
      <label class="settings-label" for="order-mode">Ordering</label>
      <div class="settings-field">
        <select id="order-mode">
          <option value="smart">Smart — moments play together</option>
          <option value="shuffle">Shuffle</option>
        </select>
      </div>
      <label class="settings-label" for="gap">Moment gap</label>
      <div class="settings-field">
        <input id="gap" type="number" min="1" max="720" step="1"> <span class="unit">minutes between shots</span>
      </div>
      <label class="settings-label" for="cap">Cluster cap</label>
      <div class="settings-field">
        <input id="cap" type="number" min="2" max="100" step="1"> <span class="unit">photos per moment</span>
      </div>
    </div>
    <button id="start" type="button">Start slideshow</button>
    <p class="settings-hint">During the show — S: settings &nbsp;·&nbsp; O: overlay &nbsp;·&nbsp; Q: flag queue &nbsp;·&nbsp; D/E/M/R: flag &nbsp;·&nbsp; any other input exits</p>
  </section>
  <section id="message" class="screen hidden"></section>
  <div id="stage" class="hidden"></div>
  <div id="overlay" class="hidden" aria-hidden="true"></div>
  <div id="toast" role="status"></div>
  <script src="index.js"></script>
</body>
</html>
