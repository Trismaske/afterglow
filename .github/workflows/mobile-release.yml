name: mobile-release

# Release APK on mobile-m* tags, uploaded to a GitHub Release —
# the mobile counterpart of desktop-release.yml. apps/mobile/android is
# gitignored (expo prebuild output), so CI regenerates it with prebuild,
# then runs Gradle; Metro bundling happens inside assembleRelease. The
# release build signs with the standard shared debug keystore (same
# signature as local builds), so testers upgrade in place.
on:
  push:
    tags:
      - 'mobile-m*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build -w @afterglow/core
      - run: npm test -w @afterglow/core
      - run: npm test -w afterglow-companion
      - run: npm run typecheck -w afterglow-companion
      - name: Generate the android project
        run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: apps/mobile/android
      - name: Name the APK after the tag
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "afterglow-companion-${GITHUB_REF_NAME}.apk"
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: afterglow-companion-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
